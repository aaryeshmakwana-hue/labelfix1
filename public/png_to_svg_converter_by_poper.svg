<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 15 482 482" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Charcoal/Espresso -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181513"/>
      <stop offset="45%" stop-color="#12100f"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>

    <!-- Outer Gold Border Gradient -->
    <linearGradient id="borderGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5dcbe"/>
      <stop offset="25%" stop-color="#d4aa79"/>
      <stop offset="70%" stop-color="#9a7042"/>
      <stop offset="100%" stop-color="#cda16e"/>
    </linearGradient>

    <!-- Top Slanted Bar Gold Gradient -->
    <linearGradient id="goldBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae5cc"/>
      <stop offset="25%" stop-color="#e0b885"/>
      <stop offset="70%" stop-color="#b88b54"/>
      <stop offset="100%" stop-color="#8c6232"/>
    </linearGradient>

    <!-- Speed Lines Gold Gradient -->
    <linearGradient id="goldSpeed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5dcbe"/>
      <stop offset="50%" stop-color="#d9ac78"/>
      <stop offset="100%" stop-color="#b88952"/>
    </linearGradient>

    <!-- 3D Ribbon Gold Gradient (L Foot & Twist) -->
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae7d0"/>
      <stop offset="25%" stop-color="#e5bd88"/>
      <stop offset="65%" stop-color="#b8874c"/>
      <stop offset="100%" stop-color="#8a5c28"/>
    </linearGradient>

    <!-- Ribbon Under-Curl Shadow -->
    <linearGradient id="curlShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55391a"/>
      <stop offset="100%" stop-color="#140d06"/>
    </linearGradient>

    <!-- Folded Flap Gold -->
    <linearGradient id="dogEarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d8b8"/>
      <stop offset="50%" stop-color="#cca16e"/>
      <stop offset="100%" stop-color="#916a3a"/>
    </linearGradient>

    <!-- Ivory White Gradient for F and L Stems -->
    <linearGradient id="ivoryStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#faf7f1"/>
      <stop offset="100%" stop-color="#eae3d4"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <!-- Label Card Shadow -->
    <filter id="labelShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Squircle with Gold Rim -->
  <rect x="18" y="18" width="476" height="476" rx="98" fill="url(#bgGrad)" stroke="url(#borderGold)" stroke-width="4.5"/>

  <!-- ==================== "F" CHARACTER ==================== -->
  
  <!-- 1. Top Floating Slanted Gold Bar (Parallelogram) -->
  <path d="M 170 132 L 304 132 L 268 176 L 134 176 Z" 
        fill="url(#goldBar)" 
        filter="url(#shadow)"/>

  <!-- 2. Three Gold Speed Lines on Left -->
  <g fill="url(#goldSpeed)" filter="url(#shadow)">
    <!-- Top Speed Line (Medium) -->
    <rect x="112" y="215" width="40" height="11" rx="5.5"/>
    <!-- Middle Speed Line (Longest, reaches furthest left) -->
    <rect x="82" y="238" width="70" height="11" rx="5.5"/>
    <!-- Bottom Speed Line (Medium) -->
    <rect x="100" y="261" width="52" height="11" rx="5.5"/>
  </g>

  <!-- 3. Ivory F Stem & Arched Shoulder -->
  <path d="M 150 176 
           C 150 176, 154 176, 164 176
           C 184 176, 196 190, 196 210
           L 196 360
           L 150 360
           L 150 220
           C 150 200, 148 190, 144 184
           Z" 
        fill="url(#ivoryStem)" 
        filter="url(#shadow)"/>

  <!-- 4. Central Shipping Label Document -->
  <g transform="translate(196, 202)" filter="url(#labelShadow)">
    <!-- Label Base with Dog-Ear Corner cut (Width: 96, Height: 94) -->
    <path d="M 0 0 
             L 70 0 
             L 96 26 
             L 96 90 
             C 96 93.3, 93.3 96, 90 96
             L 6 96 
             C 2.7 96, 0 93.3, 0 90 
             Z" 
          fill="#fdfbf8"/>

    <!-- Dog-Ear Under-Shadow -->
    <path d="M 70 26 L 96 26 L 70 0 Z" fill="#000000" opacity="0.25"/>

    <!-- Folded Dog-Ear Flap (Gold 3D Curl) -->
    <path d="M 70 0 
             C 70 14, 76 26, 96 26 
             L 70 26 
             Z" 
          fill="url(#dogEarGold)"/>

    <!-- Top Dark Header Banner / Pill -->
    <rect x="10" y="14" width="46" height="12" rx="3.5" fill="#1b1816"/>

    <!-- Bottom Left 3 Horizontal Barcode / Text Lines -->
    <g fill="#1b1816">
      <rect x="10" y="38" width="32" height="5" rx="2.5"/>
      <rect x="10" y="48" width="32" height="5" rx="2.5"/>
      <rect x="10" y="58" width="32" height="5" rx="2.5"/>
    </g>

    <!-- Bottom Right QR Code Matrix -->
    <g transform="translate(52, 36)">
      <!-- Finder 1: Top-Left -->
      <rect x="0" y="0" width="14" height="14" rx="1.5" fill="#1b1816"/>
      <rect x="2.5" y="2.5" width="9" height="9" fill="#fdfbf8"/>
      <rect x="4.5" y="4.5" width="5" height="5" fill="#1b1816"/>

      <!-- Finder 2: Top-Right -->
      <rect x="18" y="0" width="14" height="14" rx="1.5" fill="#1b1816"/>
      <rect x="20.5" y="2.5" width="9" height="9" fill="#fdfbf8"/>
      <rect x="22.5" y="4.5" width="5" height="5" fill="#1b1816"/>

      <!-- Finder 3: Bottom-Left -->
      <rect x="0" y="18" width="14" height="14" rx="1.5" fill="#1b1816"/>
      <rect x="2.5" y="20.5" width="9" height="9" fill="#fdfbf8"/>
      <rect x="4.5" y="22.5" width="5" height="5" fill="#1b1816"/>

      <!-- Data Dots -->
      <rect x="14.5" y="2" width="2.5" height="2.5" fill="#1b1816"/>
      <rect x="14.5" y="7" width="2.5" height="2.5" fill="#1b1816"/>
      <rect x="6" y="14.5" width="2.5" height="2.5" fill="#1b1816"/>
      <rect x="14.5" y="14.5" width="3" height="3" fill="#1b1816"/>
      <rect x="20" y="14.5" width="3" height="3" fill="#1b1816"/>
      <rect x="26" y="14.5" width="3" height="3" fill="#1b1816"/>
      <rect x="14.5" y="20" width="3" height="3" fill="#1b1816"/>
      <rect x="20" y="20" width="3.5" height="3.5" fill="#1b1816"/>
      <rect x="26" y="24" width="3.5" height="4.5" fill="#1b1816"/>
      <rect x="14.5" y="26" width="3" height="3" fill="#1b1816"/>
    </g>
  </g>

  <!-- ==================== "L" CHARACTER ==================== -->

  <g filter="url(#shadow)">
    <!-- 1. Ivory Upper Vertical Ribbon with Rounded Dome Top -->
    <path d="M 312 153
             A 21 21 0 0 1 354 153
             L 354 286
             L 312 286
             Z" 
          fill="url(#ivoryStem)"/>

    <!-- 2. Inside Shadow of the 3D Ribbon Curl -->
    <path d="M 312 284
             L 354 284
             C 354 315, 340 340, 312 346
             Z" 
          fill="url(#curlShadow)"/>

    <!-- 3. The 3D Gold Ribbon Twist & Horizontal Foot -->
    <path d="M 354 284
             C 354 300, 348 318, 334 330
             L 312 360
             L 398 360
             L 426 322
             L 344 322
             C 350 310, 354 298, 354 284
             Z" 
          fill="url(#ribbonGold)"/>

    <!-- 4. Horizontal Foot Main Bar -->
    <path d="M 312 360 
             L 398 360
             L 426 322
             L 336 322
             C 326 335, 318 348, 312 360
             Z" 
          fill="url(#ribbonGold)"/>

    <!-- 5. Top-edge Golden Highlight along the foot -->
    <path d="M 338 322 L 426 322 L 422 325 L 342 325 Z" fill="#fff5e6" opacity="0.6"/>
  </g>
</svg>
